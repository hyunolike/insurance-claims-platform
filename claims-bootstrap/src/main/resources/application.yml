# ─────────────────────────────────────────────────────────────────────────────
# claims-platform 설정
#
# 비밀값에는 기본값을 주지 않는다. 미설정 시 조용히 넘어가는 대신
# 기동이 실패해야 한다 — v1은 DB 비밀번호 'changeme'가 평문으로 커밋되어 있었고,
# README는 환경변수를 쓴다고 했지만 ${} 플레이스홀더가 아예 없었다.
#
# 로컬 개발값은 .env.example 참고.
# ─────────────────────────────────────────────────────────────────────────────

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: claims-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${DB_USERNAME:claims}
    password: ${DB_PASSWORD}              # 기본값 없음 → 미설정 시 기동 실패
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate는 검증만 한다.
      # v1은 테스트에서 create-drop을 써서 마이그레이션이 한 번도 실행되지 않았다.
      ddl-auto: validate
    open-in-view: false                   # 뷰 렌더링 중 DB 연결 점유 방지
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul

  flyway:
    enabled: true
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:claims-platform}
      auto-offset-reset: earliest
      enable-auto-commit: false           # 처리와 커밋을 트랜잭션으로 묶는다

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

claims:
  encryption:
    key: ${CLAIMS_ENCRYPTION_KEY}         # 기본값 없음
    key-version: ${CLAIMS_ENCRYPTION_KEY_VERSION:v1}

  adjudication:
    ruleset-version: ${RULESET_VERSION:2026.01}
    # 이 금액을 넘으면 자동 승인하지 않고 심사자에게 회부한다 (R-RTE-010)
    auto-approve-threshold-won: ${AUTO_APPROVE_THRESHOLD_WON:1000000}

  ledger:
    # 승인만 되고 미지급인 건이 한도를 영구 점유하지 않도록 예약을 만료시킨다
    reservation-ttl: ${LEDGER_RESERVATION_TTL:P7D}

  outbox:
    relay-batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
    relay-interval: ${OUTBOX_RELAY_INTERVAL:PT0.5S}

  policy-gateway:
    base-url: ${POLICY_SERVICE_URL:http://localhost:8081}
    timeout: ${POLICY_SERVICE_TIMEOUT:PT3S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true                     # liveness/readiness 분리
      show-details: when-authorized
  metrics:
    tags:
      application: claims-platform

logging:
  level:
    root: INFO
    com.insurance.claims: ${LOG_LEVEL:INFO}
