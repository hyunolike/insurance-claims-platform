// ─────────────────────────────────────────────────────────────
// claims-bootstrap : Spring Boot 애플리케이션, 설정 조립
//
// 모든 모듈이 여기 모인다. 그래서 아키텍처 검증(ArchitectureTest)과
// 전체 스택 통합 테스트도 여기서 돈다.
// ─────────────────────────────────────────────────────────────

plugins {
    alias(libs.plugins.spring.boot)
}

dependencies {
    implementation project(':claims-domain')
    implementation project(':claims-application')
    implementation project(':claims-rules')
    implementation project(':claims-adapter-web')
    implementation project(':claims-adapter-persistence')
    implementation project(':claims-adapter-messaging')
    implementation project(':claims-adapter-policy')
    implementation project(':claims-adapter-external')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 통합 테스트에서 JdbcTemplate / TransactionTemplate 으로 스키마와 트랜잭션 경계를 직접 검증한다
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.security:spring-security-test'

    // 아키텍처 규칙 — 모든 모듈이 클래스패스에 있어야 검증할 수 있다
    testImplementation libs.archunit.junit5

    // 통합 테스트는 실제 PostgreSQL에서 돈다. H2를 쓰지 않는다.
    testImplementation libs.testcontainers.junit
    testImplementation libs.testcontainers.postgresql
}

// bootstrap은 설정 조립이 대부분이라 커버리지 기준을 따로 두지 않는다.
// 검증의 무게는 ArchitectureTest 와 통합 테스트가 진다.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit { counter = 'LINE'; minimum = 0.00 }
        }
    }
}

// ─── ★ 계약 테스트 ────────────────────────────────────────────────────────────
// 이 저장소는 계약의 소비자다. 계약 파일을 여기서 선언하고 business-support 로 동기화한다.
// 양쪽이 같은 파일을 각자의 관점에서 검증해야 순환 검증을 피할 수 있다.
//   여기  : 이 바이트를 해싱하면 이 체크섬이 나오는가?
//   BS    : 렌더한 결과가 정확히 이 바이트인가?
tasks.register('contractTest', Test) {
    group = 'verification'
    description = 'business-support 와의 스냅샷 계약을 검증'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform { includeTags 'contract' }
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// build 에 포함시킨다. "나중에 따로 돌리는 것"이 되면 아무도 안 돌린다.
tasks.named('check') { dependsOn 'contractTest' }

tasks.named('test') {
    useJUnitPlatform { excludeTags 'contract' }
}
