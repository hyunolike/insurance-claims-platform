name: CI

on:
  pull_request:
    branches: [main, develop]
  # 작업 브랜치에서도 돌린다.
  # main/develop 에만 걸어 두면 PR을 열기 전까지 아무것도 검증되지 않아서,
  # Testcontainers 통합 테스트(로컬에서 Docker 없이 skip되는 것들)를 확인할 방법이 없다.
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'claude/**'

# 같은 브랜치에 연속 푸시되면 이전 실행을 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── 소스가 .gitignore 에 먹히지 않았는가 ────────────────────────
      # `out/` 규칙이 헥사고날의 port/out/ 패키지를 통째로 삼켜서
      # 로컬은 빌드되는데 CI 는 "package does not exist" 로 깨진 적이 있다.
      # 컴파일 에러보다 먼저, 원인을 그대로 알려주고 멈춘다.
      - name: Ignored source guard
        run: |
          hidden=$(git ls-files --others --ignored --exclude-standard \
                     -- '*/src/**/*.java' '*/src/**/*.sql' '*/src/**/*.yml')
          if [ -n "$hidden" ]; then
            echo "::error::.gitignore 가 소스 파일을 제외하고 있습니다:"
            echo "$hidden"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 전체 빌드 ────────────────────────────────────────────────────
      # Testcontainers가 여기서 실제로 실행된다.
      # GitHub Actions 러너에는 Docker가 있으므로 통합 테스트가 skip되지 않는다.
      - name: Build & Test
        env:
          # 비밀값은 기본값이 없다. 없으면 기동이 실패하는 것이 정상 동작이다.
          DB_PASSWORD: ci-only-not-a-secret
          CLAIMS_ENCRYPTION_KEY: ci-only-not-a-secret
        run: ./gradlew build --no-daemon

      # ── 아키텍처 규칙 ────────────────────────────────────────────────
      # v1이 무너진 지점들을 여기서 막는다:
      #   - 도메인이 Spring을 참조
      #   - application이 ApplicationEventPublisher를 직접 사용
      #   - 의존 방향 역전
      - name: Architecture rules
        run: ./gradlew :claims-bootstrap:test --tests '*ArchitectureTest' --no-daemon

      # ── 커버리지 게이트 ──────────────────────────────────────────────
      # v1 실측은 라인 68% / 브랜치 22%였다.
      # 브랜치가 낮다는 건 분기(=비즈니스 규칙)를 테스트하지 않았다는 뜻이다.
      - name: Coverage gate
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          retention-days: 7

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v1은 DB 비밀번호가 application.yml에 평문으로 커밋되어 있었다.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
