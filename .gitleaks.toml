# gitleaks 설정.
#
# 기본 룰셋을 그대로 쓴다. 비밀값 스캐닝은 v1 에서 DB 비밀번호를 평문으로 커밋한
# 사고를 막기 위한 장치다. 예외는 최소한으로만 둔다 —
# 넓게 잡으면 진짜 유출이 그 틈으로 지나간다.
#
# ⚠️ gitleaks 8.24 기준, 전역 예외는 `[allowlist]` (단수) 만 동작한다.
#    `[[allowlists]]` (복수) 로 쓰면 파싱은 되지만 **조용히 무시된다.**
#    `condition = "AND"` 도 이 블록에서는 적용되지 않아 항상 OR 로 동작한다.
#    그래서 경로 조건을 함께 걸지 않았다 — 걸면 OR 로 풀려서
#    docs/ 의 마크다운 전체가 스캔 대상에서 빠진다.
#    예외는 아래 정규식 하나로만 좁힌다.

[extend]
useDefault = true

[allowlist]
description = "설계 문서의 Idempotency-Key 헤더 예시 (자격증명이 아님)"
regexTarget = "line"
regexes = ['''Idempotency-Key:\s*[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}''']
