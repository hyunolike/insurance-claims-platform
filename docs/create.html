<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 청구 — Insurance Claims</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Claims</h1>
                <nav class="nav">
                    <a href="index.html" class="nav-link">대시보드</a>
                    <a href="create.html" class="nav-link active">새 청구</a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Hero Section -->
            <section class="hero">
                <h2 class="hero-title">새로운 청구</h2>
                <p class="hero-subtitle">보험금 청구를 제출하세요</p>
            </section>

            <!-- Form -->
            <div class="form-container">
                <form class="claim-form" id="claimForm">
                    <div class="form-group">
                        <label class="form-label" for="policyNumber">보험계약번호</label>
                        <input
                            type="text"
                            id="policyNumber"
                            name="policyNumber"
                            class="form-input"
                            placeholder="예: POL-20260101-00001"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="claimAmount">청구금액</label>
                        <div class="input-wrapper">
                            <input
                                type="number"
                                id="claimAmount"
                                name="claimAmount"
                                class="form-input"
                                placeholder="0"
                                min="0"
                                step="1000"
                                required
                            >
                            <span class="input-suffix">원</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="incidentDate">발생일자</label>
                        <input
                            type="date"
                            id="incidentDate"
                            name="incidentDate"
                            class="form-input"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">청구사유</label>
                        <textarea
                            id="description"
                            name="description"
                            class="form-textarea"
                            placeholder="청구 사유를 상세히 입력해주세요"
                            rows="6"
                            required
                        ></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="button button-secondary" onclick="window.location.href='index.html'">
                            취소
                        </button>
                        <button type="submit" class="button button-primary">
                            청구 제출
                        </button>
                    </div>
                </form>

                <!-- Success Message -->
                <div class="success-message" id="successMessage" style="display: none;">
                    <h3 class="success-title">청구가 성공적으로 제출되었습니다</h3>
                    <p class="success-text">청구번호: <span id="claimNumberDisplay"></span></p>
                    <button class="button button-primary" onclick="window.location.href='index.html'">
                        대시보드로 돌아가기
                    </button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p class="footer-text">© 2026 Insurance Claims System</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
    <script src="js/create.js"></script>
</body>
</html>
