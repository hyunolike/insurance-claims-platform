<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청구 관리 — Insurance Claims</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Claims</h1>
                <nav class="nav">
                    <a href="index.html" class="nav-link active">대시보드</a>
                    <a href="create.html" class="nav-link">새 청구</a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Hero Section -->
            <section class="hero">
                <h2 class="hero-title">청구 관리</h2>
                <p class="hero-subtitle">진행 중인 보험금 청구를 확인하고 관리하세요</p>
            </section>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <button class="filter-button active" data-status="all">전체</button>
                <button class="filter-button" data-status="SUBMITTED">제출됨</button>
                <button class="filter-button" data-status="IN_REVIEW">검토중</button>
                <button class="filter-button" data-status="APPROVED">승인됨</button>
                <button class="filter-button" data-status="REJECTED">거절됨</button>
                <button class="filter-button" data-status="PAID">지급완료</button>
            </div>

            <!-- Claims List -->
            <div class="claims-list" id="claimsList">
                <!-- Claims will be dynamically loaded here -->
                <div class="loading">청구 내역을 불러오는 중...</div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p class="footer-text">© 2026 Insurance Claims System</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
